; PlatformIO Project Configuration File
; ESP32 firmware per protocollo acustico AUSP via FPGA
;   - UART2 (pin RX=27, TX=14) verso FPGA: riceve char dal decoder,
;     manda char all'emettitore
;   - Serial (USB) usato come debug + console
;   - Blynk per controllo remoto (V1 = console virtuale)

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Dashboard web via WebSocket. WiFi e indirizzo del server relay si configurano
; in src/web_link.cpp (WIFI_SSID / WIFI_PASS / WS_HOST / WS_PORT / WS_USE_TLS).
lib_deps =
    links2004/WebSockets@^2.4.0
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -O2
    -mlongcalls
    -Wl,-u,setup -Wl,-u,loop
    -DUSE_ARDUINO_FRAMEWORK
    ; --- UART verso FPGA (Serial2) ---
    -DFPGA_UART_BAUD=115200
    -DFPGA_UART_RX_PIN=27
    -DFPGA_UART_TX_PIN=14

build_src_filter = +<*.cpp> +<*.c>
upload_speed = 115200
upload_port = /dev/cu.usbserial-599D0190451
monitor_port = /dev/cu.usbserial-599D0190451
